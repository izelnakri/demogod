[package]
name = "demogod"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Records terminal and browser demos from a tape: GIF, MP4, WebM, PNG and asciicast, deterministic and fast, from one static binary."
authors = ["Izel Nakri <contact@izelnakri.com>"]
license = "MIT"
repository = "https://github.com/izelnakri/demogod"
homepage = "https://github.com/izelnakri/demogod"
documentation = "https://docs.rs/demogod"
readme = "README.md"
keywords = ["demo", "gif", "terminal", "vhs", "screencast"]
categories = ["command-line-utilities", "multimedia::video", "development-tools"]
include = ["src/**/*", "assets/**/*", "README.md", "LICENSE", "CHANGELOG.md"]

[[bin]]
name = "demogod"
path = "src/main.rs"

[dependencies]
# Each one is here because writing it would be worse than depending on it:
color_quant = "1.1"                                         # NeuQuant, for GIF frames that hold more than 256 colours (browser panes)
fontdue = "0.9"                                             # glyph rasterizer: no system font stack, no C
gif = { version = "0.14", default-features = false, features = ["std"] }
lexopt = "0.3"                                              # argv, without a derive macro
png = "0.18"
portable-pty = "0.9"                                        # a real PTY on Unix, ConPTY on Windows
regex-lite = "0.1"                                          # `Wait /pattern/`, without Unicode tables
serde_json = "1"                                            # the Chrome DevTools protocol, and `--json`
unicode-width = "0.2"                                       # how many columns a character takes (vt100 already needs it)
vt100 = "0.16"                                              # the terminal emulator the PTY writes into

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"

# Rendering is the hot path of every test that records; unoptimized it dominates the suite.
[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1

# `cargo binstall demogod` downloads the release archive instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/demogod-{ target }.tar.gz"
bin-dir = "demogod-{ target }/demogod{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/demogod-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/demogod-{ target }.zip"
pkg-fmt = "zip"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
